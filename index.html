        // Store birth chart data globally for PDF generation
        let currentBirthChartData = null;

        // Birth Chart Generator - API-Ready with Demo Fallback
        async function generateBirthChart() {
            const name = document.getElementById('bc-name').value.trim();
            const place = document.getElementById('bc-place').value.trim();
            const dateStr = document.getElementById('bc-date').value;
            const timeStr = document.getElementById('bc-time').value || "12:00";
            
            if (!place || !dateStr) return;
            
            // Show loading state
            const submitBtn = document.querySelector('#bc-form button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'Generating Insights... ✨';
            submitBtn.disabled = true;
            
            try {
                // Check if API endpoints are configured (not default values)
                const hasAPIEndpoints = window.ENV.GEOCODE_ENDPOINT !== '/api/geocode' || 
                                       window.ENV.ASTROLOGY_ENDPOINT !== '/api/astrology';
                
                let insights;
                if (hasAPIEndpoints && window.ENV.GEOCODE_ENDPOINT.startsWith('http')) {
                    // API MODE: Call serverless functions
                    console.log('Running in API mode with serverless functions');
                    const coordinates = await getCoordinatesFromAPI(place);
                    const astrologyData = await getAstrologyDataFromAPI(dateStr, timeStr, coordinates);
                    insights = parseAstrologyData(astrologyData, place, dateStr, timeStr);
                } else {
                    // DEMO MODE: Use local sun sign inference
                    console.log('Running in DEMO mode. Deploy serverless functions for real data.');
                    const sunSign = inferSunSign(dateStr);
                    const payload = { place, dateStr, timeStr, sunSign };
                    insights = buildInsights(payload);
                }
                
                // Store data for PDF generation
                currentBirthChartData = {
                    name: name || 'Your',
                    place,
                    date: dateStr,
                    time: timeStr,
                    insights
                };
                
                renderInsights(insights);
            } catch (error) {
                console.error('Birth chart generation error:', error);
                // Fallback to demo mode
                const sunSign = inferSunSign(dateStr);
                const payload = { place, dateStr, timeStr, sunSign };
                const insights = buildInsights(payload);
                
                currentBirthChartData = {
                    name: name || 'Your',
                    place,
                    date: dateStr,
                    time: timeStr,
                    insights
                };
                
                renderInsights(insights);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        // Call serverless geocoding function
        async function getCoordinatesFromAPI(place) {
            const response = await fetch(window.ENV.GEOCODE_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ place })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Geocoding failed');
            }
            
            return await response.json();
        }

        // Call serverless astrology function
        async function getAstrologyDataFromAPI(date, time, coordinates) {
            const response = await fetch(window.ENV.ASTROLOGY_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    date,
                    time,
                    latitude: coordinates.latitude,
                    longitude: coordinates.longitude
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'Astrology data fetch failed');
            }
            
            return await response.json();
        }

                    body: `Location: ${place} | Born: ${dateStr} at ${timeStr}${apiData.house_system ? ` | Houses: ${apiData.house_system} system` : ''}`

        // Demo mode: Sun sign inference (no API needed)
        function inferSunSign(isoDate) {
            const [y, m, d] = isoDate.split('-').map(Number);
            const md = m * 100 + d;
            
            if (md >= 321 && md <= 419) return "Aries";
            if (md >= 420 && md <= 520) return "Taurus";
            if (md >= 521 && md <= 620) return "Gemini";
            if (md >= 621 && md <= 722) return "Cancer";
            if (md >= 723 && md <= 822) return "Leo";
            if (md >= 823 && md <= 922) return "Virgo";
            if (md >= 923 && md <= 1022) return "Libra";
            if (md >= 1023 && md <= 1121) return "Scorpio";
            if (md >= 1122 && md <= 1221) return "Sagittarius";
            if ((md >= 1222 && md <= 1231) || (md >= 101 && md <= 119)) return "Capricorn";
            if (md >= 120 && md <= 218) return "Aquarius";
            return "Pisces";
        }

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
(function () {
  /* Smooth scroll for internal links (#features, #how-it-works, etc.) */
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      const id = a.getAttribute('href');
      if (id && id.length > 1) {
        e.preventDefault();
        const el = document.querySelector(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      }
    });
  });

  /* Birth-chart demo (no external APIs required). 
     Generates insights + enables PDF download. */
  const form = document.getElementById('bc-form');
  const results = document.getElementById('bc-results');
  const pdfSection = document.getElementById('pdf-download-section');
  let current = null;

  if (!form || !results) return;

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const name  = (document.getElementById('bc-name').value || '').trim() || 'Your';
    const place = (document.getElementById('bc-place').value || '').trim();
    const date  = document.getElementById('bc-date').value;
    const time  = document.getElementById('bc-time').value || '12:00';

    if (!place || !date) return;

    const btn = form.querySelector('button[type="submit"]');
    const old = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = 'Generating Insights... ✨';

    try {
      const sun = inferSunSign(date);
      const insights = buildInsights({ place, date, time, sun });
      current = { name, place, date, time, insights };
      render(insights);
      if (pdfSection) pdfSection.style.display = 'block';
    } finally {
      btn.disabled = false; btn.innerHTML = old;
    }
  });

  function inferSunSign(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const md = m * 100 + d;
    if (md >= 321 && md <= 419) return 'Aries';
    if (md >= 420 && md <= 520) return 'Taurus';
    if (md >= 521 && md <= 620) return 'Gemini';
    if (md >= 621 && md <= 722) return 'Cancer';
    if (md >= 723 && md <= 822) return 'Leo';
    if (md >= 823 && md <= 922) return 'Virgo';
    if (md >= 923 && md <= 1022) return 'Libra';
    if (md >= 1023 && md <= 1121) return 'Scorpio';
    if (md >= 1122 && md <= 1221) return 'Sagittarius';
    if ((md >= 1222 && md <= 1231) || (md >= 101 && md <= 119)) return 'Capricorn';
    if (md >= 120 && md <= 218) return 'Aquarius';
    return 'Pisces';
  }

  function buildInsights({ place, date, time, sun }) {
    return [
      {
        title: 'Personality Traits',
        body: `${sun} energy themes: leadership, initiative and directness balanced with mindful patience. Core drive: to act with purpose and courage.`
      },
      {
        title: 'Emotional Patterns',
        body: 'You recharge through warmth and honest connection. Notice tendencies to react quickly—slow breath steers feeling into clarity.'
      },
      {
        title: 'Life Purpose & Challenges',
        body: 'Purpose: channel your fire into service and creative impact. Challenge: avoid burnout by honoring cycles of effort and rest.'
      },
      {
        title: 'Compatibility & Relationship Dynamics',
        body: 'You thrive with allies who value independence and openness. Harmony grows when each person’s pace and space is respected.'
      },
      {
        title: 'Timing of Major Life Themes',
        body: 'Use new moons for fresh starts; full moons for release. Choose one 30-day focus and track small wins weekly.'
      },
      {
        title: 'Your Birth Profile',
        body: `Birth data received: ${place}, ${date} at ${time}. Save this profile to revisit patterns monthly. (Demo mode – connect APIs for full chart).`
      }
    ];
  }

  function render(items) {
    results.classList.add('active');
    results.innerHTML = items.map(i => `
      <div class="insight-card">
        <h3>${i.title}</h3>
        <p>${i.body}</p>
      </div>
    `).join('');
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* Expose PDF download used by the button in your markup */
  window.downloadBirthChartPDF = function () {
    if (!current) { alert('Please generate your birth chart first.'); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const margin = 20;
    const width = doc.internal.pageSize.getWidth() - margin * 2;
    let y = 20;

    doc.setFontSize(22);
    doc.text('🌙 LunaAI Birth Chart Report', margin, y); y += 8;
    doc.setDrawColor(184, 165, 217); doc.line(margin, y, margin + width, y); y += 10;

    doc.setFontSize(11);
    const prettyDate = new Date(current.date + 'T00:00:00')
      .toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    [ (current.name !== 'Your' ? `Name: ${current.name}` : 'Your Birth Chart'),
      `Place: ${current.place}`,
      `Date: ${prettyDate}`,
      `Time: ${current.time}`
    ].forEach(t => { doc.text(t, margin, y); y += 6; });
    y += 4;

    current.insights.forEach(sec => {
      if (y > 260) { doc.addPage(); y = 20; }
      doc.setTextColor(155, 126, 189); doc.setFont(undefined, 'bold'); doc.text(sec.title, margin, y); y += 6;
      doc.setTextColor(60, 60, 80); doc.setFont(undefined, 'normal');
      doc.splitTextToSize(sec.body, width).forEach(line => {
        if (y > 280) { doc.addPage(); y = 20; }
        doc.text(line, margin, y); y += 5;
      });
      y += 4;
    });

    y = doc.internal.pageSize.getHeight() - 12;
    doc.setFontSize(8); doc.setTextColor(120);
    doc.text('Generated by LunaAI — For reflection & wellness only.', margin, y);
    const namePart = current.name !== 'Your' ? current.name.replace(/\s+/g, '_') + '_' : '';
    doc.save(namePart + 'Birth_Chart.pdf');
  };
})();
</script>
